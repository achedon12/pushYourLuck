name: Bug
description: Signaler un comportement incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour le signalement. **Pour une faille de sécurité, n'utilise pas
        ce formulaire** : voir SECURITY.md.
  - type: textarea
    id: observe
    attributes:
      label: Ce qui se passe
      description: Décris le comportement observé.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode de jeu concerné
      options: ["Partie du jour", "Partie libre", "Les deux", "Hors jeu (site)"]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 130 sur Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version affichée en bas de page
      placeholder: v1.0.0
