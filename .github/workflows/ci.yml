name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : pousser trois fois d'affilée ne doit pas
# occuper trois runners pour un résultat qui sera de toute façon écrasé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, typage et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Le client Prisma est généré, pas installé : sans cette étape, tous les
      # imports `@/generated/prisma` échouent à la compilation.
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit

  fonctionnel:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pushyourluck_test
          MYSQL_USER: pushyourluck
          MYSQL_PASSWORD: pushyourluck
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://pushyourluck:pushyourluck@127.0.0.1:3307/pushyourluck_test
      TEST_DATABASE_URL: mysql://pushyourluck:pushyourluck@127.0.0.1:3307/pushyourluck_test
      NEXT_DISABLE_STANDALONE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `migrate deploy`, comme en production : la CI éprouve ainsi le SQL
      # réellement déployé et non une projection du schéma.
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:functional
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Les tests visuels ne tournent PAS ici : le rendu des polices diffère d'une
  # machine à l'autre, et une référence produite sur le poste de développement
  # échouerait sur le runner sans qu'aucune régression n'existe. Ils se lancent
  # en local (`npm run test:visual`) — voir CONTRIBUTING.md.
